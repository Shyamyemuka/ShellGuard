version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ARCHESTRA_API_KEY=${ARCHESTRA_API_KEY}
      - ARCHESTRA_RUNTIME_URL=${ARCHESTRA_RUNTIME_URL}
      - APP_ENV=production
      - DATABASE_PATH=/data/shellguard.db
    volumes:
      - app_data:/data
    privileged: false
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws/terminal
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
